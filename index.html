          if (enhanceState.observerHandles[kind]) {
            enhanceState.observerHandles[kind].disconnect();

          if (enhanceState.observerHandles[kind]) return;
          var target = (options && options.target) || getEnhancementRoot();
          if (!target) return;

          var observer = new MutationObserver(function () {
            runPass();
            if (isDone()) {

            }
          });

          observer.observe(target, {
            subtree: true,

          return "data:image/svg+xml;charset=UTF-8," + encodeURIComponent(svg);
        }

        function createProductPreview(config) {
          var preview = document.createElement("div");
          preview.className = "dashboard-product-preview";

          var image = document.createElement("img");
          image.className = "dashboard-product-preview-img";
          image.loading = "lazy";
          image.decoding = "async";
          image.alt = (config.title || "Project") + " preview";
          if (config.previewFallbackImage) {
            image.onerror = function () {
              if (image.dataset.previewFallbackTried === "1") {
                image.onerror = null;
                image.src = buildPreviewDataUri(config.previewKind || config.slug || "scout");
                return;
              }
              image.dataset.previewFallbackTried = "1";
              image.src = config.previewFallbackImage;
            };
          }
          image.src = config.previewImage || buildPreviewDataUri(config.previewKind || config.slug || "scout");
          preview.appendChild(image);

          var label = document.createElement("span");
          label.className = "dashboard-product-preview-label";
          label.textContent = config.previewLabel || "Preview";
          preview.appendChild(label);

          return preview;
        }

        function ensureCasePreview(caseCard) {
          var existing = caseCard.querySelector(".dashboard-case-preview");
          if (existing) return existing;

          var preview = document.createElement("a");
          preview.className = "dashboard-case-preview";
          preview.href = DASHBOARD_DEMO_URL;
          preview.target = "_blank";
          preview.rel = "noopener noreferrer";
          preview.setAttribute("aria-label", "Open Rivet Dash Spark demo");

          var image = document.createElement("img");
          image.className = "dashboard-case-preview-img";
          image.loading = "lazy";
          image.decoding = "async";
          image.alt = "Rivet Dash Spark dashboard preview";
          image.src = "/assets/previews/rivet-hero.webp?v=1";
          image.onerror = function () {
            if (image.dataset.previewFallbackTried === "1") {
              image.onerror = null;
              image.src = buildPreviewDataUri("titan");
              return;
            }
            image.dataset.previewFallbackTried = "1";
            image.src = "/assets/previews/rivet-hero.png?v=2";
          };
          preview.appendChild(image);

          var label = document.createElement("span");
          label.className = "dashboard-case-preview-label";
          label.textContent = "Live dashboard preview";
          preview.appendChild(label);

          var firstParagraph = caseCard.querySelector("p");
          if (firstParagraph) {
            firstParagraph.insertAdjacentElement("afterend", preview);
          } else {
            caseCard.appendChild(preview);
          }

          return preview;
        }

        function makeCaseCardClickable(caseCard) {
          if (caseCard.dataset.dashboardLinkBound === "1") return;
          caseCard.dataset.dashboardLinkBound = "1";
          caseCard.classList.add("dashboard-case-clickable");
          caseCard.setAttribute("role", "link");
          caseCard.setAttribute("tabindex", "0");
          caseCard.setAttribute("aria-label", "Open Rivet Dash Spark demo");

          function openDemo() {
            window.open(DASHBOARD_DEMO_URL, "_blank", "noopener");
          }

          caseCard.addEventListener("click", function (event) {
            if (event.target && event.target.closest("a, button, input, textarea, select, label")) return;
            openDemo();
          });

          caseCard.addEventListener("keydown", function (event) {
            if (event.key !== "Enter" && event.key !== " ") return;
            if (event.target && event.target.closest("a, button, input, textarea, select")) return;
            event.preventDefault();
            openDemo();
          });
        }

        function createProductCard(config) {
          var card = document.createElement("a");
          card.className = "dashboard-product-card";
          card.href = config.href;
          card.dataset.product = (config.slug || "").toLowerCase();
          if (config.accent) {
            card.style.setProperty("--dashboard-product-accent", config.accent);
          }
          card.setAttribute("aria-label", "Open " + config.title + " project page");

          var glow = document.createElement("span");
          glow.className = "dashboard-product-glow";

          var spark = document.createElement("span");
          spark.className = "dashboard-product-spark";

          var head = document.createElement("div");
          head.className = "dashboard-product-head";

          var id = document.createElement("div");
          id.className = "dashboard-product-id";

          var icon = document.createElement("span");
          icon.className = "dashboard-product-icon";
          icon.textContent = config.icon || config.title.charAt(0);

          var titleWrap = document.createElement("div");
          titleWrap.className = "dashboard-product-title-wrap";

          var kicker = document.createElement("p");
          kicker.className = "dashboard-product-kicker";
          kicker.textContent = config.kicker || "";

          var heading = document.createElement("h3");
          heading.className = "dashboard-product-title";
          heading.textContent = config.title;

          var badge = document.createElement("span");
          badge.className = "dashboard-product-badge";
          badge.textContent = config.status;

          titleWrap.appendChild(kicker);
          titleWrap.appendChild(heading);
          id.appendChild(icon);
          id.appendChild(titleWrap);

          head.appendChild(id);
          head.appendChild(badge);

          var body = document.createElement("p");
          body.className = "dashboard-product-copy";
          body.textContent = config.description;

          var preview = createProductPreview(config);

          var meta = document.createElement("div");
          meta.className = "dashboard-product-meta";
          (config.highlights || []).forEach(function (item) {
            var chip = document.createElement("span");
            chip.className = "dashboard-product-chip";
            chip.textContent = item;
            meta.appendChild(chip);
          });

          var footer = document.createElement("div");
          footer.className = "dashboard-product-foot";

          var signal = document.createElement("span");
          signal.className = "dashboard-product-signal";
          signal.textContent = config.signal || "Live workflow";

          var cta = document.createElement("span");
          cta.className = "dashboard-product-cta";
          cta.appendChild(document.createTextNode(config.label + " "));

          var arrow = document.createElement("span");
          arrow.className = "dashboard-product-arrow";
          arrow.textContent = "\u2197";
          cta.appendChild(arrow);

          footer.appendChild(signal);
          footer.appendChild(cta);

          card.appendChild(glow);
          card.appendChild(spark);
          card.appendChild(head);
          card.appendChild(preview);
          card.appendChild(body);
          card.appendChild(meta);
          card.appendChild(footer);
          return card;
        }

        function applyCaseStudyEnhancements() {
          var workSection = document.getElementById("work");
          if (!workSection) return false;

          var rivetHeading = findByTextWithin(workSection, "h3", "Rivet Dash Spark");
          var bulletsHeading = findByTextWithin(workSection, "h3", "What this looks like in practice");
          if (!rivetHeading || !bulletsHeading) return false;

          var caseCard = rivetHeading.closest(".linear-glass-featured");
          var bulletsCard = bulletsHeading.closest(".card-depth");
          var comparisonGrid = caseCard && caseCard.parentElement && caseCard.parentElement.parentElement;
          if (!caseCard || !bulletsCard || !comparisonGrid) return false;

          comparisonGrid.classList.add("dashboard-case-grid");
          caseCard.classList.add("dashboard-case-main");
          bulletsCard.classList.add("dashboard-case-bullets");
          ensureCasePreview(caseCard);
          makeCaseCardClickable(caseCard);

          var existingProducts = comparisonGrid.parentElement.querySelector(".dashboard-products-strip");
          if (!existingProducts) {
            var products = document.createElement("div");
            products.className = "dashboard-products-strip";
            products.appendChild(
              createProductCard({
                slug: "scout",
                title: "Scout",
                icon: "S",
                kicker: "Website Intelligence",
                status: "Live",
                description: "AI-powered website intelligence auditing with Lighthouse, local competition analysis, scoring, and free recommendations.",
                highlights: ["Free audit", "Local competitor scoring", "Action-ready recommendations"],
                signal: "Lighthouse + Local SEO intelligence",
                accent: "193 90% 62%",
                href: "https://scout.fluxninelabs.com",
                label: "Open project page",
                previewKind: "scout",
                previewImage: "/assets/previews/scout.webp?v=1",
                previewFallbackImage: "/assets/previews/scout.png?v=1",
                previewLabel: "Scout preview"
              })
            );
            products.appendChild(
              createProductCard({
                slug: "remix",
                title: "Remix",
                icon: "R",
                kicker: "Brand Consistency Engine",
                status: "Private Beta",
                description: "Brand consistency manager that checks layout, spacing, typography, colors, and improves content in your voice.",
                highlights: ["Visual consistency scan", "AI graphic enhancements", "Custom writing engine"],
                signal: "Design consistency + content voice AI",
                accent: "15 78% 62%",
                href: "/projects/remix/",
                label: "Open project page",
                previewKind: "remix",
                previewImage: "/assets/previews/remix.webp?v=1",
                previewFallbackImage: "/assets/previews/remix.png?v=1",
                previewLabel: "Remix preview"
              })
            );
            existingProducts = products;
          }
          var bulletsSlot = bulletsCard.parentElement;
          if (bulletsSlot && bulletsSlot.parentElement === comparisonGrid) {
            comparisonGrid.insertBefore(existingProducts, bulletsSlot);
          } else if (!comparisonGrid.contains(existingProducts)) {
            comparisonGrid.insertAdjacentElement("afterend", existingProducts);
          }

          return true;
        }

        function applyMobileHeroOrbMotion() {
          var heroSection = document.getElementById("main-content") || document.querySelector('section[aria-labelledby="hero-heading"]');
          if (!heroSection) return false;

          var orbShell = enhanceState.cachedNodes.orbShell;
          var orbCore = enhanceState.cachedNodes.orbCore;
          if (!orbShell || !orbCore || !document.documentElement.contains(orbShell) || !document.documentElement.contains(orbCore)) {
            var primaryOrb = Array.from(heroSection.querySelectorAll("div")).find(function (el) {
              var cls = (el.className || "").toString();
              return cls.indexOf("w-[320px]") > -1 && cls.indexOf("h-[320px]") > -1 && cls.indexOf("rounded-full") > -1;
            });
            if (!primaryOrb) return false;

            var orbLayers = primaryOrb.parentElement;
            orbCore = orbLayers && orbLayers.parentElement;
            orbShell = orbCore && orbCore.parentElement;
            enhanceState.cachedNodes.orbCore = orbCore || null;
            enhanceState.cachedNodes.orbShell = orbShell || null;
          }
          if (!orbCore || !orbShell) return false;

          var isMobile = window.matchMedia("(max-width: 767px)").matches;
          orbCore.classList.add("dashboard-hero-orb-core");
          orbShell.classList.add("dashboard-hero-orb-shell");
          orbShell.classList.toggle("dashboard-hero-orb-mobile", isMobile);
          attachOrbAmbient(orbShell);

          if (enhanceState.boundListeners.orbMotion) {
            if (typeof enhanceState.cachedNodes.updateOrbState === "function") {
              enhanceState.cachedNodes.updateOrbState();
            }
            return true;
          }

          var orbProgressRange = 220;
          var reducedMotionQuery = window.matchMedia("(prefers-reduced-motion: reduce)");
          var clamp = function (value, min, max) {
            return Math.min(max, Math.max(min, value));
          };

          var updateOrbState = function () {
            var mobile = window.matchMedia("(max-width: 767px)").matches;
            orbShell.classList.toggle("dashboard-hero-orb-mobile", mobile);
            if (!mobile) {
              orbShell.style.setProperty("--dashboard-orb-progress", "0");
              return;
            }

            if (reducedMotionQuery.matches) {
              orbShell.style.setProperty("--dashboard-orb-progress", "0.6");
              return;
            }

            var progress = clamp(window.scrollY / orbProgressRange, 0, 1);
            orbShell.style.setProperty("--dashboard-orb-progress", progress.toFixed(3));
          };

              setMenuOpen(toggle.getAttribute('aria-expanded') !== 'true');
            });
            toggle.dataset.bound = '1';
          }
          if (backdrop.dataset.bound !== '1') {
            backdrop.addEventListener('click', function () {
              setMenuOpen(false);
            });
            backdrop.dataset.bound = '1';
          }
          if (panel.dataset.bound !== '1') {
            panel.addEventListener('click', function (event) {
              var target = event.target;
              while (target && target !== panel && target.tagName !== 'A') target = target.parentElement;
              if (target && target.tagName === 'A') {
                setMenuOpen(false);
              }
            });
            panel.dataset.bound = '1';
          }

          return true;
        }

        function refreshHeroSeoCopy() {
          var heroSection = document.getElementById("main-content") || document.querySelector('section[aria-labelledby="hero-heading"]');
          if (!heroSection) return false;

          var heading = heroSection.querySelector("#hero-heading") || document.getElementById("hero-heading");
          if (!heading) return false;

          var lineScale = window.innerWidth >= 768 ? "font-size:0.83em;" : "";
          var targetHtml =
            '<span class="inline-block whitespace-nowrap" style="' + lineScale + '">Custom <span class="text-accent">AI</span> Systems</span>' +
            '<br aria-hidden="true" />' +
            '<span class="inline-block whitespace-nowrap" style="' + lineScale + '">Built for Real Work</span>';

          if (heading.style.maxWidth !== "15ch") {
            heading.style.maxWidth = "15ch";
          }
          if (heading.innerHTML !== targetHtml) {
            heading.innerHTML = targetHtml;
          }

          var heroCopy = heading.parentElement ? heading.parentElement.querySelector("p") : null;
          if (!heroCopy) return false;

          var targetCopy = "We design automation and dashboards that remove repetitive work and unify your data into one clear system.";
          if ((heroCopy.textContent || "").trim() !== targetCopy) {
            heroCopy.textContent = targetCopy;
          }

          return true;
        }

        function runCriticalEnhancementPass() {
          if (!enhanceState.criticalDone.didOrb) enhanceState.criticalDone.didOrb = applyMobileHeroOrbMotion();
          if (!enhanceState.criticalDone.didBlogNav) enhanceState.criticalDone.didBlogNav = ensureBlogNavLink();
          if (!enhanceState.criticalDone.didAboutNav) enhanceState.criticalDone.didAboutNav = ensureAboutNavLink();
          if (!enhanceState.criticalDone.didNavRename) enhanceState.criticalDone.didNavRename = renameDashboardsNavLabel();
          if (!enhanceState.criticalDone.didMobileMenu) enhanceState.criticalDone.didMobileMenu = replaceMobileBottomNavWithHamburger();
          if (!enhanceState.criticalDone.didHeroCopy) enhanceState.criticalDone.didHeroCopy = refreshHeroSeoCopy();
          return criticalPatchesComplete();
        }

        function deferredServicesComplete() {
          return enhanceState.deferredDone.didPracticalCards;
        }

        function deferredWorkComplete() {
          return enhanceState.deferredDone.didCase && enhanceState.deferredDone.didWork;
        }

        function deferredFooterComplete() {
          return enhanceState.deferredDone.didFooter;
        }

        function runDeferredServicesEnhancementPass() {
          if (!enhanceState.deferredDone.didPracticalCards) enhanceState.deferredDone.didPracticalCards = refreshPracticalSystemsCards();
          return deferredServicesComplete();
        }

        function runDeferredWorkEnhancementPass() {
          if (!enhanceState.deferredDone.didCase) enhanceState.deferredDone.didCase = applyCaseStudyEnhancements();
          if (!enhanceState.deferredDone.didWork) enhanceState.deferredDone.didWork = refreshRecentWorkIntro();
          return deferredWorkComplete();
        }

        function runDeferredFooterEnhancementPass() {
          if (!enhanceState.deferredDone.didFooter) enhanceState.deferredDone.didFooter = restoreFooterContactAndSocial();
          return deferredFooterComplete();
        }

        function runDeferredGroupOnIdle(kind, runPass, isDone) {
          if (isDone()) return;
          var exec = function () {
            if (runPass()) return;
            observeUntilComplete("deferred-" + kind, runPass, isDone, {
              target: getEnhancementRoot(),
              timeoutMs: 7000
            });
          };

          if (typeof window.requestIdleCallback === "function") {
            window.requestIdleCallback(exec, { timeout: 2800 });
          } else {
            setTimeout(exec, 700);
          }
        }

        function scheduleDeferredEnhancements() {
          if (enhanceState.deferredScheduled) return;
          enhanceState.deferredScheduled = true;

          var groups = [
            {
              key: "services",
              selector: "#services",
              rootMargin: "320px 0px",
              runPass: runDeferredServicesEnhancementPass,
              isDone: deferredServicesComplete
            },
            {
              key: "work",
              selector: "#work",
              rootMargin: "360px 0px",
              runPass: runDeferredWorkEnhancementPass,
              isDone: deferredWorkComplete
            },
            {
              key: "footer",
              selector: "footer",
              rootMargin: "420px 0px",
              runPass: runDeferredFooterEnhancementPass,
              isDone: deferredFooterComplete
            }
          ];

          var triggerGroup = function (group) {
            if (group._triggered || group.isDone()) return;
            group._triggered = true;
            if (group._observer) {
              group._observer.disconnect();
              group._observer = null;
            }
            runDeferredGroupOnIdle(group.key, group.runPass, group.isDone);
          };

          var scheduleGroupObserver = function (group) {
            if (group.isDone()) return;
            var target = document.querySelector(group.selector);
            if (!target) {
              var root = getEnhancementRoot();
              if (root) {
                observeUntilComplete("deferred-target-" + group.key, function () {
                  if (group.isDone() || group._targetFound) return;
                  var nextTarget = document.querySelector(group.selector);
                  if (!nextTarget) return;
                  group._targetFound = true;
                  scheduleGroupObserver(group);
                }, function () {
                  return !!document.querySelector(group.selector) || group.isDone();
                }, {
                  target: root,
                  timeoutMs: 5000
                });
              }
              return;
            }

            group._targetFound = true;
            var rect = target.getBoundingClientRect();
            if (rect.top <= window.innerHeight + 320) {
              triggerGroup(group);
              return;
            }

            if (typeof window.IntersectionObserver !== "function") return;
            group._observer = new IntersectionObserver(function (entries) {
              var isNear = entries.some(function (entry) { return entry.isIntersecting; });
              if (!isNear) return;
              triggerGroup(group);
            }, {
              root: null,
              rootMargin: group.rootMargin,
              threshold: 0.01
            });
            group._observer.observe(target);
          };

          groups.forEach(scheduleGroupObserver);

          var interactionTriggered = false;
          var onInteraction = function () {
            if (interactionTriggered) return;
            interactionTriggered = true;
            cleanupInteraction();
            groups.forEach(function (group) {
              if (!group.isDone()) triggerGroup(group);
            });
          };
          var cleanupInteraction = function () {
            window.removeEventListener("scroll", onInteraction);
            window.removeEventListener("touchstart", onInteraction);
            window.removeEventListener("pointerdown", onInteraction);
            window.removeEventListener("keydown", onInteraction);
          };

          window.addEventListener("scroll", onInteraction, { once: true, passive: true });
          window.addEventListener("touchstart", onInteraction, { once: true, passive: true });
          window.addEventListener("pointerdown", onInteraction, { once: true, passive: true });
          window.addEventListener("keydown", onInteraction, { once: true });

          setTimeout(function () {
            cleanupInteraction();
            groups.forEach(function (group) {
              if (!group.isDone()) triggerGroup(group);
            });
          }, 15000);
        }

        function bootstrapEnhancements() {
          if (runCriticalEnhancementPass()) {
            scheduleDeferredEnhancements();
            return;
          }

          observeUntilComplete("critical", function () {
            if (runCriticalEnhancementPass()) {
              scheduleDeferredEnhancements();
            }
          }, function () {
            var done = criticalPatchesComplete();
            if (done) {
              scheduleDeferredEnhancements();
            }
            return done;
          }, {
            target: getEnhancementRoot(),
            timeoutMs: 5000
          });
        }

        if (document.readyState === "loading") {
          document.addEventListener("DOMContentLoaded", bootstrapEnhancements);
        } else {
          bootstrapEnhancements();
        }
      })();
    </script>
  </body>
</html>
